version: "1.0.0"

backends:
  - id: "pg_demo"
    type: "RDBMS"
    provider: "postgresql"
    config:
      type: "RDBMS"
      uri: "postgresql://adp_user@localhost:5432/adp_demo"
      schema: "public"
    credentials:
      type: "env"
      key: "PG_PASSWORD"

  - id: "pgvector_demo"
    type: "VECTOR"
    provider: "pgvector"
    config:
      type: "VECTOR"
      index_name: "items"
      endpoint: "postgresql://adp_user@localhost:5433/adp_vector_demo"
      dimensions: 3
    credentials:
      type: "env"
      key: "PG_PASSWORD"
