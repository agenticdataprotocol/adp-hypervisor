version: "1.0.0"

backends:
  - id: "pg_demo"
    type: "RDBMS"
    config:
      type: "RDBMS"
      uri: "postgresql://adp_user@localhost:5432/adp_demo"
      schema: "public"
    credentials:
      type: "env"
      key: "PG_PASSWORD"

  - id: "mongo_demo"
    type: "NOSQL"
    config:
      type: "NOSQL"
      uri: "mongodb://adp_user:adp_pass@localhost:27017"
      database: "adp_demo"
