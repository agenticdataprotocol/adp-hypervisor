version: "1.0.0"

backends:
  - id: "pg_demo"
    type: "RDBMS"
    provider: "postgresql"
    config:
      type: "RDBMS"
      uri: "postgresql://adp_user@localhost:5432/adp_demo"
      schema: "public"
    credentials:
      type: "env"
      key: "PG_PASSWORD"

  - id: "local_fs"
    type: "BLOB_STORAGE"
    provider: "local"
    config:
      type: "BLOB_STORAGE"
      uri: "examples/data"
