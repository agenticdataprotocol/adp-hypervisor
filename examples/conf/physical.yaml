version: "1.0.0"

backends:
  - id: "pg_demo"
    type: "RDBMS"
    config:
      type: "RDBMS"
      uri: "postgresql://adp_user@localhost:5432/adp_demo"
      schema: "public"
    credentials:
      type: "env"
      key: "PG_PASSWORD"

  - id: "pgvector_demo"
    type: "VECTOR"
    config:
      type: "VECTOR"
      provider: "pgvector"
      index_name: "documents"
      endpoint: "postgresql://adp_user@localhost:5433/adp_demo_vector"
      dimensions: 3
    credentials:
      type: "env"
      key: "PG_PASSWORD"

  - id: "mongo_demo"
    type: "NOSQL"
    config:
      type: "NOSQL"
      uri: "mongodb://adp_user:adp_pass@localhost:27017"
      database: "adp_demo"

  - id: "posix_demo"
    type: "POSIX"
    config:
      type: "POSIX"
      root_paths:
        - "examples/posix/data"
      allow_symlinks: false
      ignore_patterns:
        - ".DS_Store"
        - "*.pyc"
        - "__pycache__"
