version: "1.0.0"

resources:
  - resourceId: "pg_demo:customers"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Customer profiles (PostgreSQL)"
    backendId: "pg_demo"
    sources:
      - source: "customers"
        fields:
          - fieldId: "id"
            type: "INTEGER"
            description: "Unique customer identifier"
          - fieldId: "name"
            type: "STRING"
            description: "Full name"
          - fieldId: "email"
            type: "STRING"
            description: "Email address"
          - fieldId: "city"
            type: "STRING"
            description: "City of residence"
          - fieldId: "created_at"
            type: "TIMESTAMP"
            description: "Account creation time"

  - resourceId: "pg_demo:products"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Product catalog (PostgreSQL)"
    backendId: "pg_demo"
    sources:
      - source: "products"
        fields:
          - fieldId: "id"
            type: "INTEGER"
            description: "Unique product identifier"
          - fieldId: "name"
            type: "STRING"
            description: "Product name"
          - fieldId: "category"
            type: "STRING"
            description: "Product category"
          - fieldId: "price"
            type: "FLOAT"
            description: "Unit price"
          - fieldId: "in_stock"
            type: "BOOLEAN"
            description: "Whether the product is currently in stock"

  - resourceId: "pg_demo:orders"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Customer orders (PostgreSQL)"
    backendId: "pg_demo"
    sources:
      - source: "orders"
        fields:
          - fieldId: "id"
            type: "INTEGER"
            description: "Unique order identifier"
          - fieldId: "customer_id"
            type: "INTEGER"
            description: "Reference to the customer"
          - fieldId: "product_id"
            type: "INTEGER"
            description: "Reference to the product"
          - fieldId: "quantity"
            type: "INTEGER"
            description: "Number of items ordered"
          - fieldId: "total"
            type: "FLOAT"
            description: "Total amount"
          - fieldId: "status"
            type: "STRING"
            description: "Order status (pending, shipped, delivered, cancelled)"
          - fieldId: "ordered_at"
            type: "TIMESTAMP"
            description: "Time the order was placed"

  - resourceId: "pgvector_demo:feedback"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Customer feedback with vector embeddings (pgvector)"
    backendId: "pgvector_demo"
    sources:
      - source: "feedback"
        fields:
          - fieldId: "id"
            type: "INTEGER"
            description: "Unique feedback identifier"
          - fieldId: "title"
            type: "STRING"
            description: "Feedback title"
          - fieldId: "content"
            type: "STRING"
            description: "Feedback body text"
          - fieldId: "category"
            type: "STRING"
            description: "Product category (Electronics, Stationery, Furniture)"
          - fieldId: "product_name"
            type: "STRING"
            description: "Name of the reviewed product"
          - fieldId: "rating"
            type: "INTEGER"
            description: "Customer rating (1-5)"
          - fieldId: "embedding"
            type: "VECTOR"
            description: "3-dimensional sentiment embedding vector"
            metadata:
              vector:
                dimensions: 3
                distanceFunction: "COSINE"
          - fieldId: "created_at"
            type: "TIMESTAMP"
            description: "Feedback submission time"

  - resourceId: "mongo_demo:customers"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Customer profiles (MongoDB)"
    backendId: "mongo_demo"
    sources:
      - source: "customers"
        fields:
          - fieldId: "_id"
            type: "STRING"
            description: "Unique document identifier"
          - fieldId: "name"
            type: "STRING"
            description: "Full name"
          - fieldId: "email"
            type: "STRING"
            description: "Email address"
          - fieldId: "city"
            type: "STRING"
            description: "City of residence"
          - fieldId: "created_at"
            type: "TIMESTAMP"
            description: "Account creation time"

  - resourceId: "mongo_demo:products"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Product catalog (MongoDB)"
    backendId: "mongo_demo"
    sources:
      - source: "products"
        fields:
          - fieldId: "_id"
            type: "STRING"
            description: "Unique document identifier"
          - fieldId: "name"
            type: "STRING"
            description: "Product name"
          - fieldId: "category"
            type: "STRING"
            description: "Product category"
          - fieldId: "price"
            type: "FLOAT"
            description: "Unit price"
          - fieldId: "in_stock"
            type: "BOOLEAN"
            description: "Whether the product is currently in stock"

  - resourceId: "mongo_demo:orders"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Customer orders (MongoDB)"
    backendId: "mongo_demo"
    sources:
      - source: "orders"
        fields:
          - fieldId: "_id"
            type: "STRING"
            description: "Unique document identifier"
          - fieldId: "customer_name"
            type: "STRING"
            description: "Name of the customer"
          - fieldId: "product_name"
            type: "STRING"
            description: "Name of the product"
          - fieldId: "quantity"
            type: "INTEGER"
            description: "Number of items ordered"
          - fieldId: "total"
            type: "FLOAT"
            description: "Total amount"
          - fieldId: "status"
            type: "STRING"
            description: "Order status (pending, shipped, delivered, cancelled)"
          - fieldId: "ordered_at"
            type: "TIMESTAMP"
            description: "Time the order was placed"

  - resourceId: "posix_demo:products"
    intentClasses: ["LOOKUP", "QUERY", "INGEST", "REVISE"]
    version: 1
    description: "Product description files (POSIX)"
    backendId: "posix_demo"
    sources:
      - source: "products"
        fields:
          - fieldId: "name"
            type: "STRING"
            description: "File or directory name"
          - fieldId: "file_name"
            type: "STRING"
            description: "File name for LOOKUP within a directory"
          - fieldId: "object_type"
            type: "STRING"
            description: "Type of object (file or directory)"
          - fieldId: "content"
            type: "STRING"
            description: "File content"
          - fieldId: "content_format"
            type: "STRING"
            description: "Content format (raw, base64, uri)"

  - resourceId: "posix_demo:invoices"
    intentClasses: ["LOOKUP", "QUERY", "INGEST", "REVISE"]
    version: 1
    description: "Invoice files (POSIX)"
    backendId: "posix_demo"
    sources:
      - source: "invoices"
        fields:
          - fieldId: "name"
            type: "STRING"
            description: "File or directory name"
          - fieldId: "file_name"
            type: "STRING"
            description: "File name for LOOKUP within a directory"
          - fieldId: "object_type"
            type: "STRING"
            description: "Type of object (file or directory)"
          - fieldId: "content"
            type: "STRING"
            description: "File content"
          - fieldId: "content_format"
            type: "STRING"
            description: "Content format (raw, base64, uri)"
