[project]
name = "adp-hypervisor"
version = "0.1.0.dev0"
description = "ADP (Agentic Data Protocol) Hypervisor - A reference implementation for AI Agent data access"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ADP Team" }]
keywords = ["adp", "agentic", "data", "protocol", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "asyncpg>=0.29,<1.0",
    "motor>=3.3,<4.0",
    "pymongo>=4.6,<5.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0,<25.0",
    "ruff>=0.2,<1.0",
    "mypy>=1.8,<2.0",
    "jsonschema>=4.0,<5.0",
    "testcontainers[postgres]>=4.0,<5.0",
    "testcontainers[mongodb]>=4.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adp_hypervisor", "src/backends"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "yaml.*", "motor.*", "bson.*", "pymongo.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.integration.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
