# Physical Manifest for MongoDB Integration Tests
# Defines the MongoDB backend configuration

version: "1.0.0"

backends:
  - id: "test_mongodb"
    type: "NOSQL"
    config:
      type: "NOSQL"
      provider: "MONGODB"
      uri: "mongodb://test:test@localhost:27017"
      database: "test"
    metadata:
      description: "MongoDB test database for integration tests"
      environment: "test"
