# Semantic Manifest for MongoDB Integration Tests
# Maps the MongoDB users collection to an ADP resource

version: "1.0.0"
defaultDomain: "com.test"

resources:
  - resourceId: "com.test:users"
    intentClasses: ["LOOKUP", "QUERY"]
    version: 1
    description: "Users collection for testing MongoDB backend"
    semanticDescription: |
      Test dataset containing user information with name and age fields.
      Used for integration testing of MongoDB backend LOOKUP and QUERY operations.
    tags:
      - "test"
      - "users"
      - "mongodb"
    backendId: "test_mongodb"
    sources:
      - source: "users"
        fields:
          - fieldId: "_id"
            type: "STRING"
            description: "MongoDB ObjectId (auto-generated)"
            metadata:
              hint: "Unique identifier for each document"
          - fieldId: "name"
            type: "STRING"
            description: "User's name"
            samples:
              - "Alice"
              - "Bob"
              - "Charlie"
            metadata:
              cardinality: 3
              hint: "Full name of the user"
          - fieldId: "age"
            type: "INTEGER"
            description: "User's age in years"
            samples:
              - 25
              - 30
              - 35
            metadata:
              cardinality: 3
              hint: "Age must be a positive integer"
