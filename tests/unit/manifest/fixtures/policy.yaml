# Policy Manifest Fixture
# Flat policy structure: each policy carries its own scope.
# MANDATORY_FILTER / OPERATIONAL use resourceId (exact).
# ACCESS uses resourceSelector (exact or wildcard).
version: "1.0.0"

policies:
  # ACCESS: exact resource — role-based intent restrictions
  - type: "ACCESS"
    resourceSelector: "com.acme.finance:bank_failures"
    roles:
      - role: "admin"
        allowedIntents: ["LOOKUP", "QUERY", "REVISE", "INGEST"]
      - role: "user"
        allowedIntents: ["LOOKUP", "QUERY"]

  # MANDATORY_FILTER: enforce data freshness for bank_failures
  - type: "MANDATORY_FILTER"
    resourceId: "com.acme.finance:bank_failures"
    fieldId: "closing_date"
    op: "GT"
    value: "2020-01-01"
    condition: "agent_tier == 'PRODUCTION'"

  # OPERATIONAL: limit results and set default sort for bank_failures
  - type: "OPERATIONAL"
    resourceId: "com.acme.finance:bank_failures"
    enforceLimit: 100
    defaultOrderBy:
      fieldId: "closing_date"
      direction: "DESC"

  # ACCESS: wildcard — viewer role for all finance resources
  - type: "ACCESS"
    resourceSelector: "com.acme.finance:*"
    roles:
      - role: "viewer"
        allowedIntents: ["LOOKUP", "QUERY"]
